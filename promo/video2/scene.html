<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Orbite promo</title>
<style>html,body{margin:0;background:#0A0D16}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script>
"use strict";
/* ===== Orbite — vidéo 45 s (16:9) « Robuste. Précise. Tunisienne. ». Rendu 100 % déterministe : render(t) dessine l'image de l'instant t. ===== */
const COL = { cosmos:"#0A0D16", c2:"#141927", ink:"#F2F4F8", ink2:"#B4BBCB", mut:"#7D869A",
  sal:"#12B76A", salL:"#4ADE80", epa:"#7A5AF8", epaL:"#A78BFA", cre:"#2F5BEA", creL:"#7EA2FF", ale:"#FDB022" };
const C = document.getElementById("c"), X = C.getContext("2d");
const S = document.createElement("canvas"); let g = S.getContext("2d");
let W = 1080, H = 1920, P = true;
const IMG = {};

/* ---------- utilitaires ---------- */
const cl = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const seg = (t, a, b) => cl((t - a) / (b - a));
const eo = x => 1 - Math.pow(1 - x, 4);
const eo5 = x => 1 - Math.pow(1 - x, 5);
const eio = x => x < .5 ? 8 * x * x * x * x : 1 - Math.pow(-2 * x + 2, 4) / 2;
const back = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const lerp = (a, b, k) => a + (b - a) * k;
const fmt = n => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${n >> 8 & 255},${n & 255},${a})`; }
const BEAT = 0.5;
const pulse = (t, k = 7) => Math.exp(-((t % BEAT + BEAT) % BEAT) * k);

function font(size, weight = 700, fam = "Brico") { g.font = `${weight} ${size}px ${fam}`; }
function text(s, x, y, o = {}) {
  g.save();
  font(o.size || 40, o.weight || 700, o.fam || "Brico");
  g.letterSpacing = (o.ls || 0) + "px";
  g.textAlign = o.align || "left"; g.textBaseline = o.base || "alphabetic";
  g.globalAlpha *= (o.alpha == null ? 1 : o.alpha);
  if (o.glow) { g.shadowColor = o.glowColor || o.color || COL.ink; g.shadowBlur = o.glow; }
  if (o.grad) { const m = g.measureText(s).width; const x0 = o.align === "center" ? x - m / 2 : o.align === "right" ? x - m : x;
    const gr = g.createLinearGradient(x0, 0, x0 + m, 0); o.grad.forEach((c, i) => gr.addColorStop(i / (o.grad.length - 1), c)); g.fillStyle = gr; }
  else g.fillStyle = o.color || COL.ink;
  g.fillText(s, x, y);
  g.restore();
}
function width(s, size, weight = 700, fam = "Brico", ls = 0) { g.save(); font(size, weight, fam); g.letterSpacing = ls + "px"; const w = g.measureText(s).width; g.restore(); return w; }
/* Ligne riche : segments {t, c, w, s, f} posés à la suite. */
function rich(segs, x, y, align = "left", alpha = 1) {
  const tot = segs.reduce((a, s) => a + width(s.t, s.s, s.w || 700, s.f || "Brico", s.ls || 0), 0);
  let cx = align === "center" ? x - tot / 2 : align === "right" ? x - tot : x;
  segs.forEach(s => { text(s.t, cx, y, { size: s.s, weight: s.w || 700, fam: s.f || "Brico", color: s.c, alpha: alpha * (s.a == null ? 1 : s.a), glow: s.glow, ls: s.ls || 0 }); cx += width(s.t, s.s, s.w || 700, s.f || "Brico", s.ls || 0); });
  return tot;
}
/* Texte « slam » : arrive grand, flou chromatique qui se résorbe. */
function slam(s, x, y, size, k, o = {}) {
  if (k <= 0) return;
  const e = eo5(k), sc = lerp(o.from || 1.55, 1, e), ab = cl(k * 3);
  g.save(); g.translate(x, y); g.scale(sc, sc);
  const off = (1 - e) * (o.split == null ? 22 : o.split);
  if (off > 0.5) {
    g.globalCompositeOperation = "lighter";
    text(s, -off, 0, { ...o, size, color: "#FF2D6F", alpha: ab * .55, grad: null, glow: 0 });
    text(s, off, 0, { ...o, size, color: "#2DE1FF", alpha: ab * .55, grad: null, glow: 0 });
    g.globalCompositeOperation = "source-over";
  }
  text(s, 0, 0, { ...o, size, alpha: ab * (o.alpha == null ? 1 : o.alpha) });
  g.restore();
}
/* Révélation mot à mot, montée + flou. */
function words(s, x, y, size, k, o = {}) {
  const ws = s.split(" "); const sp = width(" ", size, o.weight || 700, o.fam);
  const tot = ws.reduce((a, w) => a + width(w, size, o.weight || 700, o.fam, o.ls || 0), 0) + sp * (ws.length - 1);
  let cx = o.align === "center" ? x - tot / 2 : o.align === "right" ? x - tot : x;
  ws.forEach((w, i) => {
    const kk = eo(cl(k * (ws.length * .55 + 1) - i * .55));
    const ww = width(w, size, o.weight || 700, o.fam, o.ls || 0);
    if (kk > 0) text(w, cx, y + (1 - kk) * size * .45, { ...o, align: "left", size, alpha: kk * (o.alpha == null ? 1 : o.alpha) });
    cx += ww + sp;
  });
}
function rr(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
/* Carte en verre. */
function glass(x, y, w, h, r, o = {}) {
  g.save(); g.globalAlpha *= (o.alpha == null ? 1 : o.alpha);
  if (o.glow) { g.shadowColor = o.glow; g.shadowBlur = o.glowBlur || 60; }
  rr(x, y, w, h, r); g.fillStyle = o.fill || "rgba(20,25,39,0.78)"; g.fill();
  g.shadowBlur = 0;
  const gr = g.createLinearGradient(x, y, x + w, y + h);
  gr.addColorStop(0, o.edge1 || "rgba(255,255,255,0.22)"); gr.addColorStop(.5, "rgba(255,255,255,0.05)"); gr.addColorStop(1, o.edge2 || "rgba(255,255,255,0.12)");
  g.lineWidth = o.lw || 2; g.strokeStyle = gr; rr(x + 1, y + 1, w - 2, h - 2, r); g.stroke();
  const hi = g.createLinearGradient(0, y, 0, y + h * .5); hi.addColorStop(0, "rgba(255,255,255,0.06)"); hi.addColorStop(1, "rgba(255,255,255,0)");
  rr(x, y, w, h, r); g.fillStyle = hi; g.fill();
  g.restore();
}
function chip(s, x, y, o = {}) {
  const size = o.size || 26, padX = size * .8, h = size * 2;
  const w = width(s, size, o.weight || 600, o.fam || "JB", o.ls == null ? 3 : o.ls) + padX * 2 + (o.dot ? size * 1.1 : 0);
  const x0 = o.align === "center" ? x - w / 2 : o.align === "right" ? x - w : x;
  g.save(); g.globalAlpha *= (o.alpha == null ? 1 : o.alpha);
  rr(x0, y - h / 2, w, h, h / 2); g.fillStyle = o.fill || rgba(o.color || COL.salL, .12); g.fill();
  g.lineWidth = 2; g.strokeStyle = rgba(o.color || COL.salL, .45); g.stroke();
  let tx = x0 + padX;
  if (o.dot) { g.beginPath(); g.arc(tx + size * .3, y, size * .28, 0, 7); g.fillStyle = o.color || COL.salL; g.shadowColor = o.color || COL.salL; g.shadowBlur = 14; g.fill(); g.shadowBlur = 0; tx += size * 1.1; }
  g.restore();
  text(s, tx, y + size * .36, { size, weight: o.weight || 600, fam: o.fam || "JB", color: o.textColor || o.color || COL.salL, ls: o.ls == null ? 3 : o.ls, alpha: o.alpha == null ? 1 : o.alpha });
  return w;
}

/* ---------- maquettes ---------- */
function phone(img, cx, cy, w, scroll, o = {}) {
  const h = w * 2.06, r = w * .16, b = w * .032;
  g.save(); g.translate(cx, cy);
  if (o.rot) g.rotate(o.rot);
  if (o.skew) g.transform(1, o.skew, 0, 1, 0, 0);
  if (o.scale) g.scale(o.scale, o.scale);
  g.globalAlpha *= (o.alpha == null ? 1 : o.alpha);
  g.shadowColor = o.glow || rgba(COL.cre, .55); g.shadowBlur = 120; g.shadowOffsetY = 30;
  rr(-w / 2, -h / 2, w, h, r); g.fillStyle = "#05070D"; g.fill();
  g.shadowBlur = 0; g.shadowOffsetY = 0;
  const fr = g.createLinearGradient(-w / 2, -h / 2, w / 2, h / 2);
  fr.addColorStop(0, "#3A4256"); fr.addColorStop(.35, "#151A26"); fr.addColorStop(.7, "#2A3142"); fr.addColorStop(1, "#0C0F17");
  g.lineWidth = w * .018; g.strokeStyle = fr; rr(-w / 2, -h / 2, w, h, r); g.stroke();
  const sx = -w / 2 + b, sy = -h / 2 + b, sw = w - b * 2, sh = h - b * 2;
  g.save(); rr(sx, sy, sw, sh, r - b); g.clip();
  g.fillStyle = COL.cosmos; g.fillRect(sx, sy, sw, sh);
  if (img) { const ih = img.height * sw / img.width; const off = cl(scroll || 0) * Math.max(0, ih - sh); g.drawImage(img, sx, sy - off, sw, ih); }
  const gl = g.createLinearGradient(sx, sy, sx + sw, sy + sh); gl.addColorStop(0, "rgba(255,255,255,0.10)"); gl.addColorStop(.38, "rgba(255,255,255,0)"); gl.addColorStop(1, "rgba(255,255,255,0.03)");
  g.fillStyle = gl; g.fillRect(sx, sy, sw, sh);
  g.restore();
  rr(-w * .15, -h / 2 + b + w * .035, w * .3, w * .085, w * .045); g.fillStyle = "#000"; g.fill();
  g.restore();
}
function browser(img, cx, cy, w, scroll, o = {}) {
  const bar = w * .045, h = o.h || w * .62;
  g.save(); g.translate(cx, cy); if (o.scale) g.scale(o.scale, o.scale); g.globalAlpha *= (o.alpha == null ? 1 : o.alpha);
  g.shadowColor = o.glow || rgba(COL.epa, .45); g.shadowBlur = 110; g.shadowOffsetY = 26;
  rr(-w / 2, -h / 2, w, h, 22); g.fillStyle = "#0E121D"; g.fill(); g.shadowBlur = 0; g.shadowOffsetY = 0;
  g.lineWidth = 2; g.strokeStyle = "rgba(255,255,255,.14)"; g.stroke();
  ["#FF5F57", "#FEBC2E", "#28C840"].forEach((c, i) => { g.beginPath(); g.arc(-w / 2 + 30 + i * 26, -h / 2 + bar / 2, 7, 0, 7); g.fillStyle = c; g.fill(); });
  rr(-w * .22, -h / 2 + bar * .2, w * .44, bar * .6, bar * .3); g.fillStyle = "rgba(255,255,255,.06)"; g.fill();
  g.restore();
  text("espace-finances-tn · Orbite", cx, cy - h / 2 + bar * .62, { size: bar * .32, fam: "JB", weight: 500, color: COL.mut, align: "center", alpha: o.alpha == null ? 1 : o.alpha });
  g.save(); g.translate(cx, cy); if (o.scale) g.scale(o.scale, o.scale); g.globalAlpha *= (o.alpha == null ? 1 : o.alpha);
  g.beginPath(); g.roundRect(-w / 2, -h / 2 + bar, w, h - bar, [0, 0, 22, 22]); g.clip();
  if (img) { const ih = img.height * w / img.width; const off = cl(scroll || 0) * Math.max(0, ih - (h - bar)); g.drawImage(img, -w / 2, -h / 2 + bar - off, w, ih); }
  g.restore();
}

/* ---------- fond cosmique ---------- */
const STARS = (() => { const r = rng(7), a = []; for (let i = 0; i < 260; i++) a.push({ x: r(), y: r(), z: .2 + r() * .8, p: r() * 6.28 }); return a; })();
let GRAIN = null;
function makeGrain() { const c = document.createElement("canvas"); c.width = c.height = 256; const x = c.getContext("2d"), d = x.createImageData(256, 256), r = rng(3);
  for (let i = 0; i < d.data.length; i += 4) { const v = r() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } x.putImageData(d, 0, 0); return c; }
function background(t, energy) {
  const bg = g.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, "#070A12"); bg.addColorStop(1, "#0D1222");
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  const m = Math.max(W, H);
  const blobs = [
    [COL.sal, .22 + .25 * Math.sin(t * .31), .25 + .08 * Math.cos(t * .23), .55],
    [COL.epa, .78 + .15 * Math.cos(t * .27), .35 + .12 * Math.sin(t * .19), .6],
    [COL.cre, .5 + .25 * Math.sin(t * .17 + 2), .85 + .06 * Math.sin(t * .4), .7]];
  g.save(); g.globalCompositeOperation = "lighter";
  blobs.forEach(([c, bx, by, rs]) => { const rg = g.createRadialGradient(bx * W, by * H, 0, bx * W, by * H, rs * m);
    rg.addColorStop(0, rgba(c, .16 + .1 * energy)); rg.addColorStop(1, rgba(c, 0)); g.fillStyle = rg; g.fillRect(0, 0, W, H); });
  g.restore();
  /* sol en perspective */
  g.save(); const hz = H * (P ? .66 : .62);
  g.beginPath(); g.rect(0, hz, W, H - hz); g.clip();
  const fade = g.createLinearGradient(0, hz, 0, H); fade.addColorStop(0, rgba(COL.creL, 0)); fade.addColorStop(1, rgba(COL.creL, .16 + .12 * energy));
  g.strokeStyle = fade; g.lineWidth = 1.5;
  for (let i = -14; i <= 14; i++) { g.beginPath(); g.moveTo(W / 2 + i * W * .02, hz); g.lineTo(W / 2 + i * W * .22, H); g.stroke(); }
  const sp = (t * .9) % 1;
  for (let j = 0; j < 12; j++) { const k = (j + sp) / 12, yy = hz + Math.pow(k, 2.4) * (H - hz); g.beginPath(); g.moveTo(0, yy); g.lineTo(W, yy); g.stroke(); }
  g.restore();
  /* étoiles */
  STARS.forEach(s => { const x = ((s.x + t * .006 * s.z) % 1) * W, y = ((s.y - t * .012 * s.z + 1) % 1) * H;
    const a = (.25 + .55 * s.z) * (.6 + .4 * Math.sin(t * 2 + s.p)); g.fillStyle = `rgba(220,230,255,${a})`;
    g.fillRect(x, y, 1.2 + s.z * 1.8, 1.2 + s.z * 1.8); });
}
function finish(t) {
  X.save(); X.globalCompositeOperation = "overlay"; X.globalAlpha = .07;
  const p = X.createPattern(GRAIN, "repeat"); const r = rng(Math.floor(t * 60) + 11); X.translate(-r() * 256, -r() * 256);
  X.fillStyle = p; X.fillRect(0, 0, W + 256, H + 256); X.restore();
  const v = X.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .35, W / 2, H / 2, Math.max(W, H) * .75);
  v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,0,0,.55)"); X.fillStyle = v; X.fillRect(0, 0, W, H);
}

function logo(cx, cy, R, k, u, o = {}) {
  const kc = back(cl(k * 2.2)), kr = eo(seg(k, .12, .75));
  const grad = g.createLinearGradient(cx - R, cy + R, cx + R, cy - R);
  grad.addColorStop(0, COL.sal); grad.addColorStop(.55, COL.cre); grad.addColorStop(1, COL.epa);
  const rx = R, ry = R * .42, per = Math.PI * 2 * Math.sqrt((rx * rx + ry * ry) / 2);
  g.save(); g.translate(cx, cy);
  g.save(); g.rotate(34 * Math.PI / 180); g.setLineDash([per * kr, per]); g.lineWidth = R * .045; g.strokeStyle = "rgba(255,255,255,.22)"; g.beginPath(); g.ellipse(0, 0, rx, ry, 0, 0, 7); g.stroke(); g.restore();
  g.save(); g.rotate(-30 * Math.PI / 180); g.setLineDash([per * kr, per]); g.lineWidth = R * .075; g.strokeStyle = grad; g.shadowColor = COL.cre; g.shadowBlur = R * .25; g.beginPath(); g.ellipse(0, 0, rx, ry, 0, 0, 7); g.stroke();
  /* planètes */
  const pl = [[COL.sal, 2.6, .167], [COL.epa, -.55, .167], [COL.cre, 1.0, .135]];
  pl.forEach(([c, a0, r], i) => { const a = a0 + (o.spin == null ? u * (.5 + i * .12) : o.spin); const kp = back(seg(k, .3 + i * .08, .62 + i * .08));
    if (kp <= 0) return; g.beginPath(); g.arc(Math.cos(a) * rx, Math.sin(a) * ry, R * r * kp, 0, 7); g.fillStyle = c; g.shadowColor = c; g.shadowBlur = R * .3; g.fill(); });
  g.restore();
  g.beginPath(); g.arc(0, 0, R * .307 * kc, 0, 7); g.fillStyle = "#fff"; g.shadowColor = "#fff"; g.shadowBlur = R * .5 * (1 + .4 * pulse(u)); g.fill();
  g.restore();
}
function cta(cx, cy, w, h, u, t0) {
  const k = back(seg(u, t0, t0 + .45)); if (k <= 0) return;
  g.save(); g.translate(cx, cy); g.scale(k * (1 + .025 * pulse(u, 5)), k * (1 + .025 * pulse(u, 5)));
  const gr = g.createLinearGradient(-w / 2, 0, w / 2, 0); gr.addColorStop(0, COL.sal); gr.addColorStop(.55, COL.cre); gr.addColorStop(1, COL.epa);
  rr(-w / 2, -h / 2, w, h, h / 2); g.fillStyle = gr; g.shadowColor = rgba(COL.cre, .8); g.shadowBlur = 70 + 30 * pulse(u, 5); g.fill(); g.shadowBlur = 0;
  /* reflet balayant */
  g.save(); rr(-w / 2, -h / 2, w, h, h / 2); g.clip(); const sx = ((u * .7) % 1) * (w + 300) - w / 2 - 150;
  const sg = g.createLinearGradient(sx - 90, 0, sx + 90, 0); sg.addColorStop(0, "rgba(255,255,255,0)"); sg.addColorStop(.5, "rgba(255,255,255,.4)"); sg.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = sg; g.fillRect(-w / 2, -h / 2, w, h); g.restore();
  g.restore();
  g.save(); g.translate(cx, cy); g.scale(k, k);
  text("Découvrez Orbite", 0, 18, { size: 52, weight: 800, align: "center", color: "#fff" });
  g.restore();
}
function signature(cx, y, u, t0) {
  const k = eo(seg(u, t0, t0 + .5)); if (k <= 0) return;
  g.save(); g.globalAlpha = k;
  const s1 = "POWERED BY", s2 = "Mohamed Aziz Jaouadi";
  const w1 = width(s1, 20, 600, "JB", 4), w2 = width(s2, 34, 700, "Brico"), tot = w1 + 24 + w2 + 80;
  rr(cx - tot / 2, y - 38, tot, 76, 38); g.fillStyle = "rgba(255,255,255,.05)"; g.fill(); g.lineWidth = 2; g.strokeStyle = "rgba(255,255,255,.14)"; g.stroke();
  g.restore();
  text(s1, cx - tot / 2 + 40, y + 7, { size: 20, fam: "JB", weight: 600, ls: 4, color: COL.mut, alpha: k });
  text(s2, cx - tot / 2 + 40 + w1 + 24, y + 12, { size: 34, weight: 700, color: COL.ink, alpha: k });
}

/* ===== Vidéo 45 s (16:9) « Robuste. Précise. Tunisienne. » — scènes ===== */
const TN = "#E70013";
/* Drapeau tunisien qui flotte : le dessin officiel (3:2) découpé en bandes verticales décalées en vague. */
let FLAG = null;
function makeFlag() {
  const c = document.createElement("canvas"); c.width = 600; c.height = 400; const x = c.getContext("2d");
  x.fillStyle = TN; x.fillRect(0, 0, 600, 400);
  x.translate(300, 200); x.scale(5, 5);
  x.fillStyle = "#fff"; x.beginPath(); x.arc(0, 0, 20, 0, 7); x.fill();
  x.fillStyle = TN; x.beginPath(); x.arc(0, 0, 15, 0, 7); x.fill();
  x.fillStyle = "#fff"; x.beginPath(); x.arc(4, 0, 12, 0, 7); x.fill();
  x.fillStyle = TN; x.beginPath(); x.moveTo(-5, 0); x.lineTo(11.281, -5.29); x.lineTo(1.22, 8.56); x.lineTo(1.22, -8.56); x.lineTo(11.28, 5.29); x.closePath(); x.fill();
  return c;
}
function flag(cx, cy, w, t, k = 1, o = {}) {
  if (k <= 0) return;
  const h = w * 2 / 3, n = 40, sw = w / n, amp = (o.amp == null ? .045 : o.amp) * h;
  g.save(); g.globalAlpha *= cl(k * 1.5);
  g.translate(cx, cy); const sc = lerp(.6, 1, back(cl(k))); g.scale(sc, sc);
  if (o.glow) { g.shadowColor = rgba(TN, .55); g.shadowBlur = o.glow; }
  for (let i = 0; i < n; i++) {
    const ph = t * 2.6 - i * .32, dy = Math.sin(ph) * amp * (i / n * .8 + .2), sh = .86 + .14 * Math.cos(ph);
    g.drawImage(FLAG, i * FLAG.width / n, 0, FLAG.width / n + 1, FLAG.height, -w / 2 + i * sw, -h / 2 + dy, sw + 1, h);
    g.fillStyle = `rgba(0,0,0,${(1 - sh) * 1.6})`; g.fillRect(-w / 2 + i * sw, -h / 2 + dy, sw + 1, h);
  }
  g.restore();
}
/* Capture dans un cadre en verre (image entière, coins arrondis, reflet). */
function shot(img, cx, cy, w, k, o = {}) {
  if (!img || k <= 0) return;
  const h = w * img.height / img.width, e = eo5(cl(k));
  g.save(); g.globalAlpha *= cl(k * 2) * (o.alpha == null ? 1 : o.alpha);
  g.translate(cx + (o.dx || 0) * (1 - e), cy + (o.dy == null ? 80 : o.dy) * (1 - e)); g.scale(lerp(o.from || .92, 1, e), lerp(o.from || .92, 1, e));
  if (o.rot) g.rotate(o.rot * (1 - e));
  g.shadowColor = o.glow || rgba(COL.cre, .45); g.shadowBlur = 90; g.shadowOffsetY = 24;
  rr(-w / 2, -h / 2, w, h, o.r || 26); g.fillStyle = "#0B0E17"; g.fill(); g.shadowBlur = 0; g.shadowOffsetY = 0;
  g.save(); rr(-w / 2, -h / 2, w, h, o.r || 26); g.clip(); g.drawImage(img, -w / 2, -h / 2, w, h);

/* ---------- montage ---------- */
const DUREE = 45;
const SCENES = [[0, 4, s1], [4, 8, s2], [8, 13, s3], [13, 18, s4], [18, 22, s5], [22, 26, s6], [26, 30, s7], [30, 34, s8], [34, 40, s9], [40, 45, s10]];
const CUTS = SCENES.slice(1).map(s => s[0]);
const FORTS = [4, 30, 40];
function render(t) {
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.filter = "none";
  const calme = t >= 22 && t < 30;
  const energy = t < 4 ? .25 + t / 16 : calme ? .45 + .15 * pulse(t, 4) : .6 + .4 * pulse(t, 5);
  background(t, energy);
  X.setTransform(1, 0, 0, 1, 0, 0); X.globalAlpha = 1; X.filter = "none";
  X.drawImage(S, 0, 0);
  const sc = SCENES.find(s => t >= s[0] && t < s[1]) || SCENES[SCENES.length - 1];
  const u = t - sc[0], dur = sc[1] - sc[0];
  g.clearRect(0, 0, W, H);
  g.save(); sc[2](u); g.restore();
  const kin = seg(u, 0, .32), kout = sc[1] === DUREE ? 0 : seg(u, dur - .16, dur);
  const zoom = lerp(1.07, 1, eo(kin)) * lerp(1, .93, kout * kout) * (1 + .006 * pulse(t, 9) * (t > 4 && !calme ? 1 : 0));
  const shake = Math.exp(-u * 18) * (FORTS.includes(sc[0]) ? 14 : 5); const r = rng(Math.floor(t * 60));
  X.save(); X.translate(W / 2 + (r() - .5) * shake, H / 2 + (r() - .5) * shake); X.scale(zoom, zoom); X.translate(-W / 2, -H / 2);
  X.globalAlpha = eo(kin) * (1 - kout);
  const bl = (1 - eo(kin)) * 14 + kout * 10; if (bl > .4) X.filter = `blur(${bl.toFixed(1)}px)`;
  X.drawImage(S, 0, 0); X.restore(); X.filter = "none"; X.globalAlpha = 1;
  CUTS.forEach(c => { const d = t - c;
    if (d >= -.02 && d < .5) { const a = Math.exp(-Math.max(0, d) * 11) * (FORTS.includes(c) ? .85 : .22); X.fillStyle = `rgba(235,240,255,${a})`; X.fillRect(0, 0, W, H); }
    if (d >= -.12 && d < .28) { const k = (d + .12) / .4; const x = lerp(-W * .4, W * 1.4, eio(k));
      X.save(); X.globalCompositeOperation = "lighter"; X.translate(x, H / 2); X.rotate(-.35);
      const sg = X.createLinearGradient(-160, 0, 160, 0); sg.addColorStop(0, "rgba(126,162,255,0)"); sg.addColorStop(.5, "rgba(170,190,255,.28)"); sg.addColorStop(1, "rgba(167,139,250,0)");
      X.fillStyle = sg; X.fillRect(-160, -H * 1.2, 320, H * 2.4); X.restore(); } });
  finish(t);
  if (t > 44.6) { X.fillStyle = `rgba(0,0,0,${seg(t, 44.6, 45) * .5})`; X.fillRect(0, 0, W, H); }
}
async function setup() {
