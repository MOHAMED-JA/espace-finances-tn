<script type="module">
/* ===== Orbite — vidéo 4 « L'écran comme seule lumière », 30 s, 16:9.
   Un ordinateur portable dans une pièce noire, posé sur un sol laqué qui le reflète. L'écran est la seule
   source de lumière : il joue une suite d'animations de « motion design » dessinées sur un canevas 2D
   (1600 × 1000) transmis à la 3D comme texture. Le cube/planète (plan 4) est une petite scène 3D rendue
   dans une cible de rendu et composée sur l'écran ; les pixels du logo (plan 7) sont des points 3D qui
   jaillissent de l'écran dans la pièce. Le reflet du sol est une copie inversée (échelle y = −1) de
   l'ordinateur sous un sol noir semi-transparent dont l'opacité augmente avec la distance.
   render(t) est déterministe : aucune horloge, aucun hasard non graîné. ===== */
import * as THREE from "three";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

const COL = { vert: "#12B76A", vertL: "#4ADE80", vio: "#7A5AF8", vioL: "#A78BFA", bleu: "#2F5BEA", bleuL: "#7EA2FF", ambre: "#F5B70A",
  blanc: "#EEF2FF", fond: "#05070B", gris: "#AEB6C8", mut: "#7D869A", tn: "#E70013" };
const NB = " ";   /* espace insécable */
let W = 1920, H = 1080, K = 1;   /* K : échelle du calque 2D par rapport au 1080p */
const GL = document.getElementById("gl"), C = document.getElementById("c");
let F, X, calque;                /* F : image finale, X : calque des textes posés devant la 3D */
const SW = 1600, SH = 1000;      /* canevas de l'écran (16:10) */
let SC, S, texEcran, PET, PX;    /* PET : petit canevas pour la couleur moyenne de l'écran */
let renderer, scene, camera, composer, bloom, rtI, iScene, iCam;
const O = {}, IMG = {};

/* ---------- utilitaires ---------- */
const cl = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const seg = (t, a, b) => cl((t - a) / (b - a));
const eo = x => 1 - Math.pow(1 - x, 3);
const eo5 = x => 1 - Math.pow(1 - x, 5);
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eio5 = x => x < .5 ? 16 * Math.pow(x, 5) : 1 - Math.pow(-2 * x + 2, 5) / 2;
const back = x => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
function rebond(x) { const n = 7.5625, d = 2.75; if (x < 1 / d) return n * x * x; if (x < 2 / d) return n * (x -= 1.5 / d) * x + .75;
  if (x < 2.5 / d) return n * (x -= 2.25 / d) * x + .9375; return n * (x -= 2.625 / d) * x + .984375; }
const lerp = (a, b, k) => a + (b - a) * k;
const v3 = (x, y, z) => new THREE.Vector3(x, y, z);
function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${n >> 8 & 255},${n & 255},${a})`; }
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* Saisie du plan 1 : un caractère toutes les 2,0/27 s entre 0,8 et 2,8 s (mêmes instants dans musique.py). */
const Q1 = "Combien je touche vraiment" + NB + "?", Q1_T0 = .8, Q1_T1 = 2.8;
const Q6 = "assurance auto", Q6_T0 = 21.35, Q6_T1 = 22.1;
function tapes(t, s, t0, t1) { if (t < t0) return 0; return Math.min(s.length, Math.floor((t - t0) / ((t1 - t0) / (s.length - 1)) + 1e-6) + 1); }

/* ====================================================================================
   ÉCRAN : dessin 2D (coordonnées 1600 × 1000)
   ==================================================================================== */
function rr(x, y, w, h, r) { S.beginPath(); S.roundRect(x, y, w, h, r); }
function txt(s, x, y, size, o = {}) {
  S.save(); S.font = `${o.w || 700} ${size}px ${o.f || "Mona"}`; S.textAlign = o.a || "left"; S.textBaseline = o.b || "alphabetic";
  S.letterSpacing = (o.ls || 0) + "px"; S.globalAlpha *= (o.alpha == null ? 1 : o.alpha);
  if (o.glow) { S.shadowColor = o.glow; S.shadowBlur = o.blur || 24; }
  S.fillStyle = o.c || COL.blanc; S.fillText(s, x, y); S.restore();
}
function mesure(s, size, w = 700, f = "Mona", ls = 0) { S.save(); S.font = `${w} ${size}px ${f}`; S.letterSpacing = ls + "px"; const m = S.measureText(s).width; S.restore(); return m; }
/* Logo Orbite : noyau, ellipse inclinée à −30° (dégradé vert → bleu → violet) et un satellite. */
function logo(g, cx, cy, rx, a = 1, o = {}) {
  if (a <= 0) return;
  const ry = rx * .419, sw = rx * .12, rc = rx * .307, rs = rx * .15;
  g.save(); g.globalAlpha *= a; g.translate(cx, cy);
  g.save(); g.rotate(34 * Math.PI / 180); g.beginPath(); g.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2); g.lineWidth = sw * .55; g.strokeStyle = "rgba(238,242,255,.16)"; g.stroke(); g.restore();
  g.save(); g.rotate(-Math.PI / 6);
  const gr = g.createLinearGradient(-rx, 0, rx, 0); gr.addColorStop(0, COL.vert); gr.addColorStop(.55, COL.bleu); gr.addColorStop(1, COL.vio);
  if (o.glow) { g.shadowColor = rgba(COL.vio, .8); g.shadowBlur = o.glow; }
  g.beginPath(); g.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2); g.lineWidth = sw; g.strokeStyle = gr; g.stroke();
  const th = o.th == null ? -.2 : o.th;
  g.beginPath(); g.arc(rx * Math.cos(th), ry * Math.sin(th), rs, 0, Math.PI * 2); g.fillStyle = COL.vertL; g.fill();
  g.restore();
  if (o.glow) { g.shadowColor = "rgba(238,242,255,.9)"; g.shadowBlur = o.glow; }
  g.beginPath(); g.arc(0, 0, rc, 0, Math.PI * 2); g.fillStyle = "#FFFFFF"; g.fill();
  g.restore();
}
/* Icônes (tracés 24 × 24 inspirés de public/orbite/icones.svg) */
const ICO = {
  credit: () => [new Path2D("M3 10 12 4l9 6"), new Path2D("M5 10v8M9.5 10v8M14.5 10v8M19 10v8"), new Path2D("M3 20h18")],
  vie: () => [new Path2D("M12 3 4 6v6c0 4.5 3.4 8 8 9 4.6-1 8-4.5 8-9V6Z"), new Path2D("M12 15.6s-3.3-1.9-3.3-4.2a1.75 1.75 0 0 1 3.3-.8 1.75 1.75 0 0 1 3.3.8c0 2.3-3.3 4.2-3.3 4.2Z")],
  auto: () => [new Path2D("M5 16V11l2-5h10l2 5v5"), new Path2D("M3 16h18v3H3Z"), (() => { const p = new Path2D(); p.arc(7.5, 13, .8, 0, 7); p.moveTo(17.3, 13); p.arc(16.5, 13, .8, 0, 7); return p; })()],
  salaire: () => [(() => { const p = new Path2D(); p.roundRect(3, 6, 18, 12, 3); return p; })(), (() => { const p = new Path2D(); p.arc(12, 12, 2.6, 0, 7); return p; })(), new Path2D("M6.5 9.5v5M17.5 9.5v5")],
  recherche: () => [(() => { const p = new Path2D(); p.arc(11, 11, 7, 0, 7); return p; })(), new Path2D("m20 20-4-4")],
};
function icone(nom, cx, cy, taille, couleur, lw = 1.75) {
  S.save(); S.translate(cx - taille / 2, cy - taille / 2); S.scale(taille / 24, taille / 24);
  S.lineWidth = lw; S.lineCap = "round"; S.lineJoin = "round"; S.strokeStyle = couleur;
  IMG.ico[nom].forEach(p => S.stroke(p)); S.restore();
}
function tuile(nom, cx, cy, s, c, cL, rot = 0, a = 1) {
  if (a <= 0) return;
  S.save(); S.globalAlpha *= a; S.translate(cx, cy); S.rotate(rot);
  S.shadowColor = rgba(c, .55); S.shadowBlur = 50;
  const g = S.createLinearGradient(-s / 2, -s / 2, s / 2, s / 2); g.addColorStop(0, cL); g.addColorStop(1, c);
  rr(-s / 2, -s / 2, s, s, s * .26); S.fillStyle = g; S.fill(); S.shadowBlur = 0;
  const h = S.createLinearGradient(0, -s / 2, 0, s / 2); h.addColorStop(0, "rgba(255,255,255,.35)"); h.addColorStop(.5, "rgba(255,255,255,0)");
  rr(-s / 2 + 2, -s / 2 + 2, s - 4, s - 4, s * .25); S.strokeStyle = h; S.lineWidth = 3; S.stroke();
  S.translate(-cx, -cy); icone(nom, cx, cy, s * .56, "#FFFFFF", 1.9); S.restore();
}

/* ---- Plan 1 (0–3 s) : l'écran s'allume, trait de lumière, barre de saisie ---- */
function plan1(t) {
  const ks = seg(t, .3, 1.1);
  if (ks > 0 && ks < 1) {
    const xs = lerp(-600, SW + 600, eio(ks));
    S.save(); S.translate(xs, SH * .62); S.rotate(-.2); S.globalAlpha = Math.sin(Math.PI * ks);
    const g = S.createLinearGradient(-300, 0, 300, 0);
    g.addColorStop(0, "rgba(238,242,255,0)"); g.addColorStop(.4, "rgba(200,255,225,.25)"); g.addColorStop(.5, "rgba(255,255,255,1)");
    g.addColorStop(.6, "rgba(220,210,255,.25)"); g.addColorStop(1, "rgba(238,242,255,0)");
    S.fillStyle = g; S.fillRect(-300, -1000, 600, 2000); S.restore();
  }
  const kb = seg(t, .75, 1.2); if (kb <= 0) return;
  const bw = lerp(760, 1300, eo5(kb)), bh = 150, bx = SW / 2 - bw / 2, by = SH / 2 - bh / 2 - 20;
  S.save(); S.globalAlpha = cl(kb * 1.6);
  rr(bx, by, bw, bh, bh / 2); S.fillStyle = "rgba(238,242,255,.045)"; S.fill();
  const p = seg(t, .9, 1.9), base = "rgba(238,242,255,.28)", g = S.createLinearGradient(bx, 0, bx + bw, 0);
  g.addColorStop(0, base); g.addColorStop(1, base);
  if (p > 0 && p < 1) { g.addColorStop(cl(p - .12), base); g.addColorStop(cl(p), "rgba(255,255,255,1)"); g.addColorStop(cl(p + .04), base); }
  S.lineWidth = 3; S.strokeStyle = g; rr(bx, by, bw, bh, bh / 2); S.stroke();
  const ke = seg(t, 2.82, 2.95);
  if (ke > 0) { S.save(); S.shadowColor = COL.vertL; S.shadowBlur = 30; S.lineWidth = 4; S.strokeStyle = rgba(COL.vertL, ke); rr(bx, by, bw, bh, bh / 2); S.stroke(); S.restore(); }
  logo(S, bx + 82, by + bh / 2, 34, 1);
  const n = tapes(t, Q1, Q1_T0, Q1_T1), s = Q1.slice(0, n);
  S.font = `600 62px Mona`; S.letterSpacing = "0px";
  const tx = bx + 150, ty = by + bh / 2 + 22;
  if (n === 0) txt("Posez votre question…", tx, ty, 62, { w: 500, c: "rgba(174,182,200,.35)" });
  txt(s, tx, ty, 62, { w: 600 });
  const cw = mesure(s, 62, 600);
  if (t < 2.9 || Math.floor(t * 3) % 2 === 0) { S.fillStyle = COL.vertL; S.fillRect(tx + cw + 6, by + 40, 4, bh - 80); }
  /* bouton d'envoi */
  const bxx = bx + bw - 78, byy = by + bh / 2;
  S.beginPath(); S.arc(bxx, byy, 44, 0, 7); S.fillStyle = ke > 0 ? rgba(COL.vert, .25 + .75 * ke) : "rgba(238,242,255,.08)"; S.fill();
  S.strokeStyle = "#FFFFFF"; S.lineWidth = 5; S.lineCap = "round"; S.lineJoin = "round";
  S.beginPath(); S.moveTo(bxx - 16, byy); S.lineTo(bxx + 16, byy); S.moveTo(bxx + 3, byy - 14); S.lineTo(bxx + 17, byy); S.lineTo(bxx + 3, byy + 14); S.stroke();
  S.restore();
}

/* ---- Plan 2 (3–7 s) : grille, courbe d'accélération, brut puis net ---- */
const P2 = { x: 200, y: 120, w: 1200, h: 760, X0: 300, X1: 1300, Y0: 790, Y1: 250 };
const courbe = u => [P2.X0 + u * (P2.X1 - P2.X0), P2.Y0 - (1 - Math.pow(1 - u, 4)) * (P2.Y0 - P2.Y1)];
function traceCourbe(u0, u1) { S.beginPath(); const n = 140; for (let i = 0; i <= n; i++) { const [x, y] = courbe(lerp(u0, u1, i / n)); i ? S.lineTo(x, y) : S.moveTo(x, y); } }
function plan2(t) {
  const kg = eo(seg(t, 2.95, 3.6));
  S.save();
  /* cadre */
  S.globalAlpha = cl(kg * 1.5); rr(P2.x, P2.y, P2.w, P2.h, 40); S.fillStyle = "rgba(238,242,255,.02)"; S.fill();
  S.lineWidth = 3; S.strokeStyle = "rgba(238,242,255,.62)"; S.stroke();
  /* grille, dessinée de gauche à droite */
  S.save(); rr(P2.x, P2.y, P2.w * kg, P2.h, 40); S.clip(); S.strokeStyle = "rgba(238,242,255,.11)"; S.lineWidth = 2; S.beginPath();
  for (let x = P2.x + 100; x < P2.x + P2.w; x += 100) { S.moveTo(x, P2.y); S.lineTo(x, P2.y + P2.h); }
  for (let y = P2.y + 95; y < P2.y + P2.h; y += 95) { S.moveTo(P2.x, y); S.lineTo(P2.x + P2.w, y); }
  S.stroke(); S.restore();
  txt("salaire · brut → net", P2.x + 44, P2.y + 66, 40, { f: "JB", w: 500, c: "rgba(238,242,255,.55)" });
  /* courbe qui s'élance */
  const kc = eo(seg(t, 3.15, 4.15));
  if (kc > 0) {
    traceCourbe(0, kc); S.lineCap = "round"; S.lineJoin = "round";
    S.strokeStyle = rgba(COL.vert, .28); S.lineWidth = 26; S.stroke();
    S.strokeStyle = COL.vertL; S.lineWidth = 9; S.stroke();
    S.strokeStyle = "#FFFFFF"; S.lineWidth = 3.5; S.stroke();
    if (kc < 1) { const [hx, hy] = courbe(kc); halo(hx, hy, 70, COL.vertL, 1); }
  }
  /* point lumineux qui remonte la courbe */
  const kd = eio(seg(t, 4.1, 5.6));
  if (t >= 4.1) {
    const u = kd; traceCourbe(Math.max(0, u - .16), u); S.strokeStyle = "rgba(255,255,255,.95)"; S.lineWidth = 12; S.stroke();
    const [px, py] = courbe(u), pul = t > 5.6 ? 1 + .15 * Math.sin((t - 5.6) * 9) : 1;
    halo(px, py, 95 * pul, COL.vertL, 1); S.beginPath(); S.arc(px, py, 15 * pul, 0, 7); S.fillStyle = "#FFFFFF"; S.fill();
  }
  /* départ : point au pied de la courbe */
  if (kc > 0) { S.beginPath(); S.arc(P2.X0, P2.Y0, 12, 0, 7); S.fillStyle = COL.vertL; S.fill(); }
  /* cadran de progression */
  S.beginPath(); S.arc(P2.x + P2.w - 70, P2.y + 64, 22, 0, 7); S.strokeStyle = "rgba(238,242,255,.25)"; S.lineWidth = 4; S.stroke();
  if (kd > 0) { S.beginPath(); S.arc(P2.x + P2.w - 70, P2.y + 64, 22, -Math.PI / 2, -Math.PI / 2 + kd * Math.PI * 2); S.strokeStyle = COL.vertL; S.stroke(); }
  /* textes */
  const kbr = seg(t, 3.4, 3.8), kn = seg(t, 5.55, 5.9);
  txt("3" + NB + "000" + NB + "DT brut", P2.X0 + 46, P2.Y0 - 14, 54, { f: "JB", w: 600, alpha: kbr * (1 - .5 * kn), c: COL.blanc });
  if (kn > 0) { S.save(); const s = lerp(.85, 1, back(kn)); S.translate(P2.X1, P2.Y1 + 330); S.scale(s, s);
    txt("2" + NB + "161,884" + NB + "DT", 0, 0, 92, { f: "JB", w: 800, a: "right", c: COL.vertL, glow: rgba(COL.vert, .9), blur: 30, alpha: cl(kn * 2) });
    txt("net par mois", 0, 70, 50, { f: "Mona", w: 600, a: "right", c: COL.blanc, alpha: cl(kn * 2) * .8 }); S.restore(); }
  S.restore();
}
function halo(x, y, r, c, a) { const g = S.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, rgba(c, .9 * a)); g.addColorStop(.25, rgba(c, .35 * a)); g.addColorStop(1, rgba(c, 0)); S.fillStyle = g; S.fillRect(x - r, y - r, 2 * r, 2 * r); }

/* ---- Plan 3 (7–11 s) : pistes de montage et tête de lecture ---- */
const P3 = { XS: 520, XE: 1560, XA: 1060, ys: [330, 470, 610] };
function plan3(t) {
  const { XS, XE, XA, ys } = P3;
  const kr = eo(seg(t, 6.95, 7.5));
  S.save();
  /* règle */
  S.strokeStyle = "rgba(238,242,255,.35)"; S.lineWidth = 2; S.beginPath(); S.moveTo(XS, 200); S.lineTo(lerp(XS, XE, kr), 200);
  for (let i = 0, x = XS; x <= lerp(XS, XE, kr); i++, x += 29) { const h = i % 4 === 0 ? 22 : 10; S.moveTo(x, 200); S.lineTo(x, 200 - h); }
  S.stroke();
  /* pistes */
  const pistes = [["Crédit auto", COL.vert, COL.vertL], ["Crédit immobilier", COL.bleu, COL.bleuL], ["Épargne", COL.vio, COL.vioL]];
  const ph = lerp(XS, XA, eio5(seg(t, 7.9, 9.5)));
  pistes.forEach(([nom, c, cL], i) => {
    const y = ys[i], kx = eo5(seg(t, 7.05 + i * .15, 7.9 + i * .15)), dx = (1 - kx) * 1100;
    txt(nom, 40, y + 16, 46, { w: 650, c: cL, alpha: kx });
    S.globalAlpha = kx; S.strokeStyle = "rgba(238,242,255,.08)"; S.lineWidth = 2; S.beginPath(); S.moveTo(XS, y); S.lineTo(XE, y); S.stroke();
    const barres = i === 0 ? [[XS, XA, 56]] : i === 1 ? [[XS, XE + 200, 56]] : [[XS, XE + 200, 22]];
    barres.forEach(([a, b, h]) => {
      const g = S.createLinearGradient(a + dx, 0, b + dx, 0); g.addColorStop(0, rgba(c, .5)); g.addColorStop(1, rgba(c, i === 0 ? .5 : 0));
      rr(a + dx, y - h / 2, b - a, h, h / 2); S.fillStyle = g; S.fill();
      /* partie déjà lue, plus lumineuse */
      S.save(); S.beginPath(); S.rect(0, 0, ph, SH); S.clip(); rr(a + dx, y - h / 2, b - a, h, h / 2); S.fillStyle = cL; S.fill(); S.restore();
      S.strokeStyle = rgba(cL, .9); S.lineWidth = 2; rr(a + dx, y - h / 2, b - a, h, h / 2); S.stroke();
    });
    /* repères (losanges) */
    const r = mulberry(31 + i); for (let k = 0; k < 5; k++) { const x = XS + 80 + r() * (XE - XS - 160) + dx; if (i === 0 && x > XA - 20) continue;
      S.save(); S.translate(x, y); S.rotate(Math.PI / 4); S.fillStyle = "rgba(5,7,11,.85)"; S.fillRect(-7, -7, 14, 14); S.restore(); }
    S.globalAlpha = 1;
  });
  /* lignes fines décoratives sous les pistes */
  const r = mulberry(77);
  for (let row = 0; row < 6; row++) { const y = 730 + row * 26, k = eo5(seg(t, 7.3 + row * .07, 8.1 + row * .07));
    let x = XS - 40 + r() * 60; while (x < XE) { const w = 30 + r() * 170, gap = 14 + r() * 60;
      S.fillStyle = `rgba(238,242,255,${(.1 + r() * .18) * k})`; S.fillRect(x + (1 - k) * 900, y, w, 4); x += w + gap; } }
  /* fin du crédit auto */
  const kf = seg(t, 9.5, 9.9);
  if (kf > 0) { halo(XA, ys[0], 150 * (1 + .3 * (1 - kf)), COL.vertL, (1 - kf * .6));
    txt("fin du crédit auto", XA + 32, ys[0] + 16, 48, { w: 600, c: COL.blanc, alpha: kf }); }
  /* l'épargne grossit après la fin du crédit */
  const kb = eo5(seg(t, 9.75, 10.6));
  if (kb > 0) { const y = ys[2], g = S.createLinearGradient(XA, 0, XE, 0); g.addColorStop(0, COL.vioL); g.addColorStop(1, rgba(COL.vio, .2));
    S.save(); S.shadowColor = COL.vio; S.shadowBlur = 30; rr(XA, y - 28, (XE - XA) * kb, 56, 28); S.fillStyle = g; S.fill(); S.restore(); }
  const k5 = seg(t, 9.85, 10.2);
  if (k5 > 0) txt("+520" + NB + "DT par mois", XA + 24, 572 - (1 - eo5(k5)) * 20, 52, { f: "JB", w: 700, c: COL.vioL, glow: rgba(COL.vio, .9), blur: 26, alpha: k5 });
  /* tête de lecture */
  const kp = seg(t, 7.6, 7.9);
  if (kp > 0) {
    S.globalAlpha = kp;
    S.fillStyle = "rgba(238,242,255,.18)"; S.fillRect(ph - 7, 205, 14, 680);
    S.fillStyle = "#FFFFFF"; S.fillRect(ph - 1.5, 205, 3, 680);
    S.beginPath(); S.moveTo(ph - 16, 176); S.lineTo(ph + 16, 176); S.lineTo(ph, 204); S.closePath(); S.fill();
    const ka = eo5(seg(t, 9.45, 9.75));

/* Scène intérieure du plan 4 : cube de verre → planète, anneau violet, trois satellites. */
function construireInterieur() {

  const Uc = { uK: { value: 0 }, uS: { value: 0 }, uA: { value: 1 }, uR: { value: .98 }, uCol: { value: new THREE.Color(COL.vert) }, uColL: { value: new THREE.Color(COL.vertL) } };

    void main(){ vec3 sp = normalize(position) * uR; vec3 p = mix(position, sp, uK); vec3 n = normalize(mix(normal, normalize(position), uK));

    fragmentShader: `uniform float uK, uA; uniform vec3 uColL; void main(){ gl_FragColor = vec4(mix(uColL, vec3(1.), .4) * (1. - uK) * uA, 1.); }` }));

}
function poserInterieur(t) {
  const k = eio(seg(t, 12.4, 13.4)), s = eio(seg(t, 13.0, 13.7)), ka = eo5(seg(t, 10.9, 11.6));

/* ---------- mise en scène ---------- */
function luminosite(t) { return cl(seg(t, .25, .45) + (t > .25 && t < .45 ? -.4 * Math.abs(Math.sin(t * 90)) : 0)) * (1 - .85 * seg(t, 29.7, 30)); }

  U.uS.value = seg(t, 23.0, 23.8) * (1 - eio(seg(t, 24.45, 25.55)));

/* ---------- calque 2D devant la 3D (mot de la fin) ---------- */

}

    titre("Conçue en Tunisie · Powered by Mohamed Aziz Jaouadi", W / 2 + 22 * K, H * .945, 32, k2, { w: 500, f: "Mona", c: COL.gris });
    if (k2 > 0) { X.save(); X.font = `500 ${32 * K}px Mona`; const lw = X.measureText("Conçue en Tunisie · Powered by Mohamed Aziz Jaouadi").width;
      const fw = 36 * K, fh = fw * 2 / 3, fx = W / 2 + 22 * K - lw / 2 - fw - 12 * K, fy = H * .945 - 23 * K + (1 - eo5(cl(k2))) * 13 * K;
      X.globalAlpha = cl(k2 * 1.6); X.beginPath(); X.roundRect(fx, fy, fw, fh, 3 * K); X.clip(); X.drawImage(IMG.drapeau, fx, fy, fw, fh); X.restore(); }

}
